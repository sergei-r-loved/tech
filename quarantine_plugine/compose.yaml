services:
  db:
    image: postgres:18.7
    restart: always

    shm_size: 128mb

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./init_db:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:${DB_PORT}"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d flakydb"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
  # app:
  #   depends_on:
  #     db:
  #       condition: service_healthy
volumes:
  postgres_data:
